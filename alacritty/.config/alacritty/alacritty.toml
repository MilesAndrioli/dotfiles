[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
opacity = 0.7
dynamic_padding = false
title = "Alacritty"

[window.padding]
x = 12
y = 6

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 5000

[font.normal]
family = "SauceCodePro Nerd Font Mono"
style = "Regular"
